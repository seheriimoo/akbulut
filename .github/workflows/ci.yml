# Nocta V1 offline CI gate.
# Runs only on pull requests targeting nocta/v1.
# No secrets, deploy, merge, App Store, RevenueCat, or production steps.

name: Nocta V1 CI

on:
  pull_request:
    branches:
      - nocta/v1

permissions:
  contents: read

concurrency:
  group: nocta-v1-ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  offline-gate:
    name: Offline gate
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.41.7"
          channel: stable
          cache: true

      - name: Fetch packages
        run: flutter pub get

      - name: Analyze active V1 allowlist
        run: |
          dart analyze --no-fatal-warnings \
            lib/core \
            lib/billing \
            lib/config \
            test/core \
            test/quality \
            test/billing \
            test/screens \
            test/ship \
            test/features \
            test/compliance

      - name: Analyze changed Dart files
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          git fetch origin "$BASE_REF" --depth=1
          mapfile -t changed < <(
            git diff --name-only --diff-filter=ACMR "origin/${BASE_REF}...HEAD" -- '*.dart' \
              | grep -vE '^(NOCTA_HISTORY/)' \
              | grep -vE '(^|/)[^/]*_backup[^/]*\.dart$' \
              | grep -vE '\.(backup|bak)$' \
              || true
          )
          if [ "${#changed[@]}" -eq 0 ]; then
            echo "No changed Dart files to analyze (HISTORY/backup excluded)."
            exit 0
          fi
          echo "Analyzing changed Dart files:"
          printf '  %s\n' "${changed[@]}"
          dart analyze --no-fatal-warnings "${changed[@]}"

      - name: Offline unit and widget tests
        run: |
          flutter test \
            test/core \
            test/quality \
            test/billing \
            test/screens \
            test/ship \
            test/features \
            test/compliance \
            test/widget_test.dart

      - name: ROUTING 18 nights only
        run: |
          flutter test \
            test/integration/v1_conversation_stress_eval_test.dart \
            --name "ROUTING 18 nights"
